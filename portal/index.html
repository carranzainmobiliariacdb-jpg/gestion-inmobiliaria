<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#15181e" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Mi alquiler · Carranza Inmobiliaria</title>
  <link rel="icon" href="logo-carranza.png" />
  <link rel="apple-touch-icon" href="logo-carranza.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>
  <header class="cab">
    <img src="logo-carranza.png" alt="" class="cab-logo" id="cab-logo" />
    <div class="cab-txt">
      <span class="cab-marca" id="cab-marca">CARRANZA</span>
      <span class="cab-sub">INMOBILIARIA · Mi alquiler</span>
    </div>
  </header>

  <main id="app">
    <div class="cargando" id="cargando"><div class="spinner"></div>Cargando tus datos…</div>
  </main>

  <div class="hoja hidden" id="hoja">
    <div class="hoja-caja">
      <div class="hoja-cab"><h2 id="hoja-titulo"></h2><button class="hoja-x" id="hoja-x" aria-label="Cerrar">✕</button></div>
      <div class="hoja-cuerpo" id="hoja-cuerpo"></div>
    </div>
  </div>
  <div class="toast hidden" id="toast"></div>

  <script src="config.js"></script>
  <script type="module" src="portal.js"></script>
</body>
</html>
